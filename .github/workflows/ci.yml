name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install "verified-executable-search @ git+https://github.com/Zhuchen00123/Verified-Executable-Search@485ec38d"
          pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check .
      - name: Pytest (non-docker)
        run: pytest -m 'not docker'
